name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint / types / tests / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          # Monorepo: single root lockfile covers frontend + shared workspaces
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspaces root)
        run: npm ci

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Type check
        run: npm run type-check
        working-directory: frontend

      - name: Unit tests (Vitest)
        run: npm run test:ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          # Minimal env for a clean CI build (no local .env files in CI).
          # NEXT_PUBLIC_* values ship in the client bundle by definition.
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8082/api
          INTERNAL_API_URL: http://127.0.0.1:8082
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/thanawy_ci?sslmode=disable

  knip:
    name: Dead code report (knip)
    runs-on: ubuntu-latest
    # Report-only for now: the audit documented known dead code
    # (src/data-access, exams/components, unused hooks, ...). Remove this
    # flag once the cleanup lands so knip becomes a hard gate.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspaces root)
        run: npm ci

      - name: Run knip
        run: npm run knip

  audit:
    name: Security audit (npm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      # Blocking gate — critical vulns in production dependencies fail CI.
      # (npm audit only needs the lockfile; no install required.)
      - name: npm audit — critical (blocking)
        run: npm audit --omit=dev --audit-level=critical

      # Report-only — known high advisories exist (next/postcss/undici/
      # dompurify, tracked in the audit). Promote to blocking once fixed.
      - name: npm audit — high (report only)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
