name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-types:
    name: API contracts — fetch + generate + freshness check
    runs-on: ubuntu-latest
    # Pulls the swagger artifact produced by the backend CI
    # (d:\backend\.github\workflows\ci.yml → upload-artifact) and
    # regenerates the TypeScript types. The check step fails if the
    # generated types drift from what's checked in — meaning someone
    # changed the spec but forgot to commit the regen result.
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Download backend swagger artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971bfdc8ddfe5c # v4.1.8
        with:
          name: backend-swagger
          path: artifacts/swagger
          # The artifact may not exist on first runs (no backend build yet)
          # or on PRs from forks. Don't block the entire pipeline for it —
          # the freshness check below will catch a real drift.
          fail-on-error: false
        continue-on-error: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspaces root)
        run: npm ci

      - name: Fetch swagger into contracts package
        # If a backend artifact was downloaded, use it. Otherwise fall
        # back to the placeholder checked into the repo (CI still runs
        # the freshness check so a missing artifact is caught loudly).
        # `--allow-missing` keeps the job green until the backend CI
        # starts uploading artifacts; remove it once `swag init` is
        # wired into the backend pipeline.
        run: |
          if [ -f artifacts/swagger/swagger.json ]; then
            export GITHUB_ARTIFACT_PATH="$PWD/artifacts/swagger/swagger.json"
          fi
          node scripts/fetch-swagger.mjs --allow-missing

      - name: Regenerate API types
        run: npm run generate:api-types

      - name: Verify generated types match committed file
        run: node scripts/check-api-types-fresh.mjs

  frontend:
    name: Frontend — lint / types / tests / build
    runs-on: ubuntu-latest
    # The contract types job must finish first so the freshly
    # regenerated `packages/contracts/src/generated/api.ts` is on disk.
    needs: contracts-types
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          # Monorepo: single root lockfile covers frontend + shared workspaces
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspaces root)
        run: npm ci

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Type check
        run: npm run type-check
        working-directory: frontend

      - name: Unit tests (Vitest)
        # Contract drift is now caught by the `contracts-types` job above,
        # which fails the build if the generated TS types don't match the
        # swagger spec. The previous string-level contract test
        # (api-contract.test.ts) has been retired.
        run: npm run test:ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          # Minimal env for a clean CI build (no local .env files in CI).
          # NEXT_PUBLIC_* values ship in the client bundle by definition.
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8082/api
          INTERNAL_API_URL: http://127.0.0.1:8082
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/thanawy_ci?sslmode=disable

  knip:
    name: Dead code report (knip)
    runs-on: ubuntu-latest
    # Report-only for now: the audit documented known dead code
    # (src/data-access, exams/components, unused hooks, ...). Remove this
    # flag once the cleanup lands so knip becomes a hard gate.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspaces root)
        run: npm ci

      - name: Run knip
        run: npm run knip

  audit:
    name: Security audit (npm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      # Blocking gate — critical vulns in production dependencies fail CI.
      # (npm audit only needs the lockfile; no install required.)
      - name: npm audit — critical (blocking)
        run: npm audit --omit=dev --audit-level=critical

      # Blocking gate — runtime (production) high-severity vulns are NOT
      # acceptable in a long-lived product. The previous "report only"
      # posture accumulated a backlog of known issues in next/postcss/undici/
      # dompurify that never closed.
      #
      # Policy: any high-severity advisory in a runtime dependency
      # (`--omit=dev`) blocks merge. dev-only high advisories remain
      # report-only because they don't ship to production. New high
      # advisories have a 7-day remediation window tracked in
      # docs/audit-report.md; after that window the CI gate enforces.
      #
      # To mute a specific advisory during the window, pin it via
      # `npm audit fix --omit=dev` or use an `overrides` entry in
      # package.json and document it in docs/audit-report.md.
      - name: npm audit — high in runtime deps (blocking)
        run: npm audit --omit=dev --audit-level=high

      # Report-only — dev-only high advisories (vitest/playwright/eslint
      # toolchain). These never reach the production bundle; surface them
      # for awareness but do not block merge.
      - name: npm audit — high in dev deps (report only)
        run: npm audit --audit-level=high
        continue-on-error: true
