  # لذلك خدمة postgres معطّلة هنا لتجنب التعارض على المنفذ وفقدان البيانات.
  # لتشغيل Postgres عبر Docker بدلاً من المحلي، أوقف خدمات PostgreSQL المحلية
  # ثم أزل التعليق عن الكتلة التالية.
