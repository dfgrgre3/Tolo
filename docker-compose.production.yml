version: "3.9"

networks:
  thanawy-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-data:
  redis-data:

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - thanawy-net
    environment:
      POSTGRES_USER: thanawy
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: thanawy_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thanawy -d thanawy_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - thanawy-net
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1G"
        reservations:
          cpus: "0.25"
          memory: "256M"

  frontend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME_FRONTEND:-thanawy/thanawy-app}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - thanawy-net
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set to the real backend URL}
      INTERNAL_API_URL: http://backend:8082
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY must be set to the PEM public key for edge verification}
      JWT_EXPECTED_ISSUER: ${JWT_EXPECTED_ISSUER:?JWT_EXPECTED_ISSUER must be set}
      JWT_EXPECTED_AUDIENCE: ${JWT_EXPECTED_AUDIENCE:?JWT_EXPECTED_AUDIENCE must be set}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # service_started (not healthy): the backend image is external to this
      # repo, so its healthcheck is best-effort. Runtime readiness is proven
      # by /api/readyz instead of blocking frontend startup on it.
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - thanawy-net
    # Internal-only: not published to the host. The frontend reaches the
    # backend over the `thanawy-net` bridge via http://backend:8082 (see
    # INTERNAL_API_URL above). Only the `frontend` service should be exposed
    # to the host / public internet, ideally behind a reverse proxy that
    # terminates TLS and forwards to frontend:3000.
    expose:
      - "8082"
    # Best-effort readiness gate: the backend image lives outside this repo
    # (context ../backend), so keep the probe tool-agnostic (wget, else curl).
    # If the image ships neither, this stays unhealthy — frontend startup is
    # intentionally NOT gated on it (see frontend depends_on); /api/readyz
    # is the authoritative readiness signal for orchestrators.
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8082/health/live || curl --fail --silent http://localhost:8082/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8082
      GIN_MODE: release
    env_file:
      - ../backend/.env
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1G"
        reservations:
          cpus: "0.25"
          memory: "256M"
